name: Check core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
  cloud:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/cloud/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx vitest run
  desktop:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test test/mac-signing.test.mjs
      - run: npm run setup:assets
      - run: npm run package:mac
      - name: Verify packaged identity and desktop regressions
        run: |
          export GRATIS_TEST_APP="$PWD/release/Gratis Core-darwin-$(node -p process.arch)/Gratis Core.app/Contents/MacOS/Gratis Core"
          node test/package-edition.mjs
          npm run test:ui
